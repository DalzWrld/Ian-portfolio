<style>
  :root {
    --cream: #EFE6D6;
    --ghost: #E3D6BC;
    --green: #12332A;
    --green-hover: #1B4A3C;
    --gold: #C8A45C;
    --gold-deep: #8F6B2A;
    --soft: #B9C4BC;
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--green);
    background: var(--cream);
  }
  main {
    position: relative;
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 20px 40px;
    overflow: hidden;
  }
  .ghost {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 210px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ghost);
    pointer-events: none;
    user-select: none;
  }
  header { position: relative; padding-top: 70px; }
  h1 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(32px, 9vw, 40px);
    line-height: 1.1;
  }
  .rule { width: 56px; height: 1px; background: #B8924A; margin: 18px 0; }
  .tagline { margin: 0 0 32px; font-size: 17px; line-height: 1.4; }
  ul { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--green);
    color: #F3EBDD;
    text-decoration: none;
    transition: background-color 0.15s;
  }
  a.link:hover { background: var(--green-hover); }
  a.link:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
  a.link svg { flex: none; stroke: var(--gold); }
  .label { display: flex; flex-direction: column; gap: 2px; }
  .label strong { font-weight: 500; font-size: 17px; }
  .label span { font-size: 14px; color: var(--soft); }
  a.link.quiet { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
  a.link.quiet:hover { background: rgba(18, 51, 42, 0.08); }
  a.link.quiet svg { stroke: var(--gold-deep); }
  a.link.quiet .label span { color: #4A5D54; }
  footer { position: relative; margin-top: 32px; font-size: 14px; color: #4A5D54; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; }
